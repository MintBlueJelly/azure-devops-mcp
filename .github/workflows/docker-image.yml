name: Docker Image CI

# An allowlist, not an ignore list: a version tag should mean the image changed, and every other
# path here — the README, this workflow — builds a byte-identical image.
#
# The image's whole content is the npm package pinned in the dockerfile, so that is the only input.
# Use the Actions "Run workflow" button to rebuild when no listed path changed — a base-image CVE,
# say.
on:
  push:
    branches: ["main"]
    paths: &image_inputs
      - "azure-devops-mcp.dockerfile"
  pull_request:
    branches: ["main"]
    paths: *image_inputs
  workflow_dispatch:

permissions:
  contents: write # create the release
  packages: write # push image to ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Both outputs are computed once and reused, so nothing downstream rebuilds the reference by
      # hand. GHCR requires a lowercase repository path, and `github.repository` preserves the
      # owner's casing — metadata-action lowercases it silently, so an image reference assembled
      # anywhere else has to do the same or it will not match.
      #
      # The dockerfile's npm pin is the only place the version lives. Deriving the tag from it is
      # what stops the image saying one version while containing another.
      - name: Resolve image name and version
        id: img
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          version=$(sed -n 's|^RUN npm install -g @azure-devops/mcp@\([0-9][0-9.]*\)$|\1|p' azure-devops-mcp.dockerfile)
          test -n "$version" || { echo "no @azure-devops/mcp@<version> found in the dockerfile" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.img.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: azure-devops-mcp.dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: ${{ github.event_name == 'pull_request' }}

      # Proves the entrypoint resolves and the binary runs. `--help` is enough: the server needs a
      # credential for anything else, and a broken ENTRYPOINT is the failure this image can actually
      # have — a runner that appends arguments gets a container that exits immediately, with nothing
      # in its log to say why.
      #
      # On a pull request this runs against the locally loaded image; on main it pulls back what was
      # just pushed, so it also proves the push landed.
      - name: Smoke test
        run: docker run --rm ${{ steps.img.outputs.name }}:${{ steps.img.outputs.version }} --help

      # After the smoke test, so a release only ever describes an image that started. The tag is the
      # upstream version rather than one derived from commit history, so a rebuild at an unchanged
      # pin finds its release already there — skipping is correct, not a failure.
      - name: Create release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.img.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists — nothing to do"
            exit 0
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "Image: \`${{ steps.img.outputs.name }}:${{ steps.img.outputs.version }}\`"
